[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-index"
version = "0.2.0"
description = "AI-Powered Semantic Document Index with FastAPI, PostgreSQL, and pgvector"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.30",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.5",
    "pydantic-settings>=2.2.1",
    "sentence-transformers>=2.7.0",
    "python-multipart>=0.0.9",
    "uuid6>=2024.1.1",
    "pdfplumber>=0.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "isort",
]
